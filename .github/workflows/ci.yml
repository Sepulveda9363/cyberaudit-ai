name: CyberAudit AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # 3. Instalar dependencias y verificar sintaxis (Linter preliminar)
    - name: Install dependencies
      run: |
        python -m pip upgrade pip
        pip install -r requirements.txt

    # 4. Construir la imagen de Docker para validar que no falle el empaquetado
    - name: Build Docker Image
      run: |
        docker build -t cyberaudit-ai:test .